<h2>Real-Time Stock Data</h2>
<div *ngIf="!loading" class="stock-container">
  <app-stock-card
    *ngFor="let stock of stocks; let i = index"
    [stock]="stock"
    [backgroundClass]="statuses[i]"
    [isEnabled]="enabledStates[i]"
    (toggle)="toggleStock(i, $event)"
  ></app-stock-card>
</div>
<div *ngIf="loading" class="loader-container">
  <div class="spinner"></div>
  <p>Loading stock data...</p>
</div>
